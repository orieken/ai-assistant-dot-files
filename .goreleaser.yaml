version: 2
project_name: loom

before:
  hooks:
    - go mod tidy

builds:
  - id: loom
    main: ./cmd/loom
    binary: loom
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/orieken/loom/cmd/loom/cmd.version={{.Version}}
      - -X github.com/orieken/loom/cmd/loom/cmd.commit={{.Commit}}
      - -X github.com/orieken/loom/cmd/loom/cmd.date={{.Date}}

archives:
  - id: loom
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Source archive published alongside binary archives so users can download
# and build locally (go install or homebrew formula build from source).
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

release:
  github:
    owner: orieken
    name: loom
  draft: false
  prerelease: auto
