version: "1.0"
hooks:
  - id: "documentation-auditor-inventory-change"
    event: "on-inventory-change"
    enabled: true
    action:
      type: "agent"
      target: "documentation-auditor"
      args:
        passContext: true
        # Findings land in docs/audits/doc-audit-YYYY-MM-DD.md.
        # Copy this file to .claude/hooks/ in your project to opt in.
