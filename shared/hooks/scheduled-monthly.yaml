version: "1.0"

# Hook: scheduled-monthly
# Opt-in monthly schedule for maintenance skills. Copy to .claude/hooks/ and configure a cron
# runner (e.g., GitHub Actions schedule, CronCreate, or the /schedule skill) to invoke this.
# Default: all targets disabled. Enable individually per project need.
# AOS Phase 3 (v3.2).

hooks:
  - id: "forgetting-engine-monthly"
    event: "scheduled-monthly"
    enabled: false
    description: >
      Monthly staleness sweep: invokes forgetting-engine to scan shared/knowledge/ and
      docs/lessons-learned/ for items that have not been referenced in 6+ months and have
      no recent linking in the corpus. Produces a draft expiration proposal — never archives
      without explicit human confirmation ("approve expiration" or "confirm").
    schedule:
      # cron expression: first day of every month at 09:00 UTC
      # Platforms: GitHub Actions (schedule.cron), CronCreate skill, /schedule skill
      cron: "0 9 1 * *"
    action:
      type: "skill"
      target: "forgetting-engine"
      args:
        passContext: false
        stalenessThresholdMonths: 6   # flag items not referenced in 6+ months
        draftOnly: true               # never archive without human approval (non-negotiable)
    guardrails:
      - "forgetting-engine must pause for human confirmation before archiving any file"
      - "If the skill is not found, log a warning and skip — do not fail the schedule"
      - "draftOnly: true is non-negotiable and must not be overridden by args or policy"

  - id: "memory-auditor-monthly"
    event: "scheduled-monthly"
    enabled: false
    description: >
      Monthly KI corpus health audit: invokes memory-auditor to check schema compliance,
      detect duplicates, and flag stale KIs. Read-only — produces audit findings for human
      review; never mutates files.
    schedule:
      cron: "0 9 1 * *"
    action:
      type: "agent"
      target: "memory-auditor"
      args:
        passContext: false
        scope: "full"
    guardrails:
      - "memory-auditor is read-only — it never modifies files"
      - "Audit findings go to .claude/feature-workspace/memory-audit-report.md for human review"
